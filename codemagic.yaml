workflows:
  ios-capacitor:
    name: Saylo iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: saylo_asc_key
    environment:
      # CERTIFICATE_PRIVATE_KEY lives in the "appstore_credentials" group,
      # set up in Codemagic's UI (Team settings -> Environment variables) —
      # not in this file, since it's a secret. Required for the "Set up
      # code signing" step below: fetch-signing-files --create needs an RSA
      # private key to build the certificate's CSR from, and reads it from
      # this exact env var name automatically if it isn't passed as a flag.
      # Without it, fetch-signing-files fails with "Cannot save Signing
      # Certificates without certificate private key" and every downstream
      # signing option comes back empty.
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.saylolearn.app
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal-only distribution: goes straight to the "Internal"
        # TestFlight group with no Apple review step at all. Apple's beta
        # review (submit_to_testflight: true) is only required to reach
        # EXTERNAL testers — for an internal group it adds nothing but
        # failure modes: missing-metadata rejections, and only one build
        # account-wide allowed "in review" at a time, which blocked every
        # later build behind whichever one submitted first.
        beta_groups:
          - Internal
